<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CF1322;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="#FFFFFF" />
  
  <!-- 外圈圆环 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#redGradient)" stroke-width="6" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#redGradient)" stroke-width="4" />
  <circle cx="100" cy="100" r="71" fill="none" stroke="url(#redGradient)" stroke-width="2" />
  
  <!-- 上升箭头折线（向下摆放） -->
  <path d="M40,150 L75,115 L110,150 L145,115 L180,80" fill="none" stroke="url(#redGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 箭头头部 -->
  <polygon points="180,80 175,87 185,87" fill="url(#redGradient)" />
  
  <!-- 粒子效果 -->
  <g fill="url(#redGradient)">
    <circle cx="30" cy="160" r="3" opacity="0.8" />
    <circle cx="35" cy="165" r="2.5" opacity="0.6" />
    <circle cx="40" cy="170" r="2" opacity="0.4" />
    <circle cx="45" cy="175" r="1.5" opacity="0.2" />
    <circle cx="50" cy="180" r="1" opacity="0.1" />
    
    <circle cx="32" cy="158" r="2.8" opacity="0.7" />
    <circle cx="37" cy="163" r="2.3" opacity="0.5" />
    <circle cx="42" cy="168" r="1.9" opacity="0.3" />
    <circle cx="47" cy="173" r="1.4" opacity="0.2" />
    <circle cx="52" cy="178" r="0.9" opacity="0.1" />
    
    <circle cx="34" cy="156" r="2.6" opacity="0.6" />
    <circle cx="39" cy="161" r="2.1" opacity="0.4" />
    <circle cx="44" cy="166" r="1.7" opacity="0.3" />
    <circle cx="49" cy="171" r="1.2" opacity="0.2" />
    <circle cx="54" cy="176" r="0.7" opacity="0.1" />
  </g>
  
  <!-- A文字 -->
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#redGradient)" text-anchor="middle" dominant-baseline="middle">A</text>
  
  <!-- I文字 -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#redGradient)" text-anchor="middle" dominant-baseline="middle">I</text>
  
  <!-- 点（居中放置） -->
  <circle cx="120" cy="100" r="6" fill="url(#redGradient)" />
  
  <!-- F文字 -->
  <text x="145" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#redGradient)" text-anchor="middle" dominant-baseline="middle">F</text>
  
  <!-- 内圈小方块装饰 -->
  <rect x="95" y="85" width="10" height="10" fill="url(#redGradient)" />
</svg>